[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "debug-rag"
version = "0.1.0"
description = "Debug documentation assistant — local retrieval and grounded generation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "pymilvus==2.6.2",
  "uvicorn>=0.30,<1",
  "markdown-it-py>=3,<5",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "rank-bm25>=0.2.2,<1",
  "filelock>=3.16,<4",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
local-models = [
  "sentence-transformers>=5,<6",
  "transformers>=4.55,<5",
  "torch==2.8.0",
]

[project.scripts]
debug-rag = "debug_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/debug_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "runtime/pytest-cache-p2"
markers = ["integration: requires the local Milvus service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", extra = "local-models" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
